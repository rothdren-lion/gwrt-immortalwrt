name: GWRT firmware build

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device preset'
        required: true
        default: 'cp02'
        type: choice
        options:
          - ss01
          - cs02-gwrt2
          - cs06
          - cs08
          - cs07
          - cp02
          - pzl8
          - nezha
          - bdy-g98-direct
          - bdy-g98-uefi
          - mt7981
          - mt7986
          - an758x
      version:
        description: 'Version (YYMMDD-NN), empty = today-01'
        required: false
        default: ''
      model:
        description: 'Single model (e.g. xingloo_ax3000), empty = all devices of the preset'
        required: false
        default: ''
      images:
        description: 'Artifact contents: all = firmware+manifest+buildinfo+apks, sysupgrade = only *sysupgrade* (one file)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - sysupgrade
      release:
        description: 'Publish images to GitHub Releases'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gwrt-build-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget swig xz-utils
          # bpf.mk (daed) needs unversioned llvm tools in PATH
          LLVM_BIN="$(dirname "$(readlink -f "$(command -v clang)")")"
          for t in llvm-strip llc opt llvm-dis; do
            [ -x "$LLVM_BIN/$t" ] && sudo ln -sf "$LLVM_BIN/$t" "/usr/local/bin/$t"
          done
          command -v llvm-strip && llvm-strip --version | head -1

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: gwrt-dl-${{ hashFiles('rules.mk', 'Config.in', 'include/**') }}
          restore-keys: |
            gwrt-dl-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: staging_dir/toolchain-*
          key: gwrt-tc-${{ hashFiles('toolchain/**', 'tools/**', 'include/kernel*', 'rules.mk', 'Config.in') }}
          restore-keys: |
            gwrt-tc-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # python3-base 要先编 libffi 才有 ffi.h
          sed -i 's|^  DEPENDS:=+libpython3$|  DEPENDS:=+libpython3 +libffi|' \
              feeds/packages/lang/python/python3/Makefile

      - name: Generate config
        run: |
          VER="${{ inputs.version }}"
          [ -n "$VER" ] || VER="$(date -u +%y%m%d)-01"
          echo "VER=$VER" >> "$GITHUB_ENV"
          case "${{ inputs.device }}" in
            ss01) MN="亚瑟ss-01" ;;
            cs02-gwrt2) MN="雅典娜cs-02-lan1-is-wan" ;;
            cs06) MN="赵云cs-06" ;;
            cs08) MN="太乙2pluscs-08" ;;
            cs07) MN="太乙er1-cs-07" ;;
            *) MN="" ;;
          esac
          echo "MODEL_NAME=$MN" >> "$GITHUB_ENV"
          case "${{ inputs.device }}" in
            ss01) cp config.ci-ss01-261030-01 .config ;;
            cs02-gwrt2) cp config.ci-cs02-gwrt2-261030-01 .config ;;
            cs06) OUT=.config VER="$VER" sh gwrt-mk-cs06-config.sh ;;
            cs08) OUT=.config VER="$VER" sh gwrt-mk-cs08-config.sh ;;
            cs07) cp config.ci-cs07-261030-01 .config ;;
            cp02) OUT=.config VER="$VER" sh gwrt-mk-cp02-config.sh ;;
            pzl8) OUT=.config VER="$VER" sh gwrt-mk-pzl8-config.sh ;;
            nezha) OUT=.config VER="$VER" sh gwrt-mk-nezha-config.sh ;;
            bdy-g98-direct) OUT=.config VER="$VER" BOOT=direct sh gwrt-mk-bdy-g98-config.sh ;;
            bdy-g98-uefi) OUT=.config VER="$VER" BOOT=uefi sh gwrt-mk-bdy-g98-config.sh ;;
            mt7981) OUT=.config GWRT_NO_SELF_DEFCONFIG=1 VER="$VER" sh gwrt-mk-xingloo-ax3000-config.sh ;;
            mt7986) OUT=.config GWRT_NO_SELF_DEFCONFIG=1 VER="$VER" sh gwrt-mk-mt7986-config.sh ;;
            an758x) OUT=.config VER="$VER" DEVICE=all WITH_OPENCLASH=1 WITH_SMB=1 sh gwrt-mk-an7581-config.sh ;;
            *) echo "unknown device preset: ${{ inputs.device }}"; exit 1 ;;
          esac
          # 只编一个型号：保留匹配的 DEVICE，其余删掉
          if [ -n "${{ inputs.model }}" ]; then
            M="${{ inputs.model }}"
            grep -qE "^CONFIG_TARGET_DEVICE_.*_DEVICE_${M}=y$" .config || {
              echo "ERROR: model '$M' not in preset '${{ inputs.device }}'"
              grep -E '^CONFIG_TARGET_DEVICE_' .config | head -20
              exit 1
            }
            sed -i "/^CONFIG_TARGET_DEVICE_.*_DEVICE_/ { /_DEVICE_${M}=y$/!d }" .config
            echo "model filter: $M"
          fi
          make defconfig
          # 一个预设只允许一个 SoC 序列（多 board = make world 串台）
          sh gwrt-check-target.sh .config "${{ inputs.device }}"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|^CONFIG_VERSION_NUMBER|^CONFIG_PACKAGE_(gwrt-agent|gwrt-mesh-apmode|gwrt-device-defaults|ucode-mod-socket)' .config

      - name: Build firmware
        run: |
          make -j"$(nproc)" \
            REVISION="$(git rev-parse --short HEAD)" \
            CONFIG_VERSION_DIST=GWRT \
            CONFIG_VERSION_NUMBER="$VER" \
            || make -j1 V=s \
            REVISION="$(git rev-parse --short HEAD)" \
            CONFIG_VERSION_DIST=GWRT \
            CONFIG_VERSION_NUMBER="$VER"

      - name: Collect images
        if: success()
        run: |
          mkdir -p out
          if [ "${{ inputs.images }}" = "sysupgrade" ]; then
            # 只要一个固件文件，省流量
            find bin/targets -type f -name '*sysupgrade*' -exec cp -v {} out/ \;
          else
            find bin/targets -type f \( -name '*sysupgrade*' -o -name '*factory*' -o -name '*initramfs*' -o -name '*.manifest' -o -name 'sha256sums' \) -exec cp -v {} out/ \;
            find bin/targets -maxdepth 3 -type f \( -name 'profiles.json' -o -name 'version.buildinfo' -o -name 'config.buildinfo' -o -name 'feeds.buildinfo' \) -exec cp -v {} out/ \;
            find bin/packages -type f \( -name 'easytier*.apk' -o -name 'xray-core*.apk' -o -name 'sing-box*.apk' -o -name 'v2ray-geo*.apk' -o -name 'chinadns-ng*.apk' -o -name 'fdisk*.apk' -o -name 'kmod-inet-diag*.apk' -o -name 'luci-app-homeproxy*.apk' -o -name 'luci-i18n-homeproxy*.apk' \) -exec cp -v {} out/ \;
            cp .config "out/config-${{ inputs.device }}-${{ env.VER }}"
          fi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-${{ inputs.device }}-${{ inputs.model || 'all' }}-${{ env.VER }}
          path: out/
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-${{ inputs.device }}-${{ inputs.model || 'all' }}-${{ env.VER }}-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish release
        if: success() && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gwrt-${{ inputs.device }}-${{ inputs.model || 'all' }}-${{ env.VER }}" out/* \
            --title "GWRT ${{ inputs.device }} ${{ inputs.model }} ${{ env.VER }}" \
            --notes "自动构建: ${{ inputs.device }} @ ${{ github.sha }}"
