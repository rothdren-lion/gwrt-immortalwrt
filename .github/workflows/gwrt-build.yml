name: GWRT firmware build

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device preset'
        required: true
        default: 'cp02'
        type: choice
        options:
          - cp02
          - pzl8
      version:
        description: 'Version (YYMMDD-NN), empty = today-01'
        required: false
        default: ''
      release:
        description: 'Publish images to GitHub Releases'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gwrt-build-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget swig xz-utils

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: gwrt-dl-${{ hashFiles('rules.mk', 'Config.in', 'include/**') }}
          restore-keys: |
            gwrt-dl-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: staging_dir/toolchain-*
          key: gwrt-tc-${{ hashFiles('toolchain/**', 'tools/**', 'include/kernel*', 'rules.mk', 'Config.in') }}
          restore-keys: |
            gwrt-tc-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          VER="${{ inputs.version }}"
          [ -n "$VER" ] || VER="$(date -u +%y%m%d)-01"
          echo "VER=$VER" >> "$GITHUB_ENV"
          case "${{ inputs.device }}" in
            cp02) OUT=.config VER="$VER" sh gwrt-mk-cp02-config.sh ;;
            pzl8) OUT=.config VER="$VER" sh gwrt-mk-pzl8-config.sh ;;
            *) echo "unknown device preset: ${{ inputs.device }}"; exit 1 ;;
          esac
          make defconfig
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|^CONFIG_VERSION_NUMBER|^CONFIG_PACKAGE_(gwrt-agent|gwrt-mesh-apmode|gwrt-device-defaults|ucode-mod-socket)' .config

      - name: Build firmware
        run: |
          make -j"$(nproc)" \
            REVISION="$(git rev-parse --short HEAD)" \
            CONFIG_VERSION_DIST=GWRT \
            CONFIG_VERSION_NUMBER="$VER" \
            || make -j1 V=s \
            REVISION="$(git rev-parse --short HEAD)" \
            CONFIG_VERSION_DIST=GWRT \
            CONFIG_VERSION_NUMBER="$VER"

      - name: Collect images
        if: success()
        run: |
          mkdir -p out
          find bin/targets -type f \( -name '*sysupgrade*' -o -name '*factory*' -o -name '*initramfs*' -o -name '*.manifest' -o -name 'sha256sums' \) -exec cp -v {} out/ \;
          find bin/targets -maxdepth 3 -type f \( -name 'profiles.json' -o -name 'version.buildinfo' -o -name 'config.buildinfo' -o -name 'feeds.buildinfo' \) -exec cp -v {} out/ \;
          find bin/packages -type f \( -name 'easytier*.apk' -o -name 'xray-core*.apk' -o -name 'sing-box*.apk' -o -name 'v2ray-geo*.apk' -o -name 'chinadns-ng*.apk' -o -name 'fdisk*.apk' -o -name 'kmod-inet-diag*.apk' \) -exec cp -v {} out/ \;
          cp .config "out/config-${{ inputs.device }}-${{ env.VER }}"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-${{ inputs.device }}-${{ env.VER }}
          path: out/
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-${{ inputs.device }}-${{ env.VER }}-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish release
        if: success() && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gwrt-${{ inputs.device }}-${{ env.VER }}" out/* \
            --title "GWRT ${{ inputs.device }} ${{ env.VER }}" \
            --notes "自动构建: ${{ inputs.device }} @ ${{ github.sha }}"
