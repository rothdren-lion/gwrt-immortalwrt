name: GWRT SS-01 NSS driver diagnostic
run-name: ss-01-261120-02 (NSS diagnostic)

on:
  push:
    branches:
      - build/ss01-nss-261120

env:
  VERSION: '261120-02'
  KERNEL_VERSION: '6.18.62'

permissions:
  contents: read

concurrency:
  group: gwrt-ss01-nss-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: SS-01 NSS Wi-Fi driver diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            build-essential busybox clang llvm flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libbpf-dev libclang-dev libncurses-dev \
            libssl-dev pkg-config python3-setuptools python3-pyelftools rsync \
            squashfs-tools unzip util-linux zlib1g-dev file wget swig xz-utils \
            zstd cmake kmod
          LLVM_BIN="$(dirname "$(readlink -f "$(command -v clang)")")"
          for tool in llvm-strip llc opt llvm-dis; do
            [ -x "$LLVM_BIN/$tool" ] && sudo ln -sf "$LLVM_BIN/$tool" "/usr/local/bin/$tool"
          done
          command -v llvm-strip

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: gwrt-dl-${{ hashFiles('rules.mk', 'Config.in', 'include/**') }}
          restore-keys: |
            gwrt-dl-

      - name: Install locked feeds
        run: |
          set -euo pipefail
          cp configs/ss01-honk-easytier-feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sh gwrt-theme-V3/scripts/integrate.sh --no-config
          sh scripts/gwrt-apply-feed-overlays.sh
          ./scripts/feeds install -a
          test -f target/linux/qualcommax/files/drivers/net/ethernet/qualcomm/qca_edma.h
          test -f target/linux/qualcommax/files/include/linux/soc/qcom/qca_ppe.h

      - name: Generate and validate SS-01 config
        run: |
          set -euo pipefail
          python3 scripts/gwrt-mk-ss01-honk-easytier-config.py "$VERSION"
          make defconfig
          sh gwrt-check-target.sh .config ss01
          python3 scripts/gwrt-validate-ss01-honk-easytier.py .config
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|^CONFIG_LINUX_VERSION|^CONFIG_PACKAGE_kmod-nss-wifi-drv|^CONFIG_PACKAGE_kmod-qca-nss-dp|^CONFIG_PACKAGE_kmod-qca-ssdk|^CONFIG_KERNEL_DEBUG_INFO_BTF' .config | tee diagnostics-config.txt

      - name: Record exact kernel inputs
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "Repository commit: $(git rev-parse HEAD)"
            echo "Kernel source selector:"
            grep -E '^LINUX_VERSION-6\.18|^LINUX_KERNEL_HASH-6\.18' target/linux/generic/kernel-6.18
            echo "Kernel patch count: $(find target/linux/qualcommax/patches-6.18 -type f | wc -l)"
            echo "Kernel package path: package/qca-nss/nss-wifi-drv"
          } | tee logs/kernel-inputs.txt

      - name: Download sources
        run: |
          set -euo pipefail
          make -j6 download 2>&1 | tee logs/download.log

      - name: Build host tools, ARM64 toolchain and target kernel
        run: |
          set -euo pipefail
          make -j6 prepare V=s REVISION="$(git rev-parse --short HEAD)" \
            GWRT_CS02_KERNEL_SIZE=12288k 2>&1 | tee logs/kernel-build.log

      - name: Verify prepared kernel
        run: |
          set -euo pipefail
          shopt -s nullglob
          kernel_dirs=(build_dir/target-*/linux-qualcommax_ipq60xx/linux-"$KERNEL_VERSION")
          test "${#kernel_dirs[@]}" -eq 1
          kernel_dir="${kernel_dirs[0]}"
          test -s "$kernel_dir/.config"
          test -s "$kernel_dir/Module.symvers"
          test "$(make -s -C "$kernel_dir" kernelversion)" = "$KERNEL_VERSION"
          cp "$kernel_dir/.config" logs/kernel.config
          cp "$kernel_dir/Module.symvers" logs/kernel-module.symvers
          cp "$kernel_dir/include/config/kernel.release" logs/kernel.release

      - name: Build only nss-wifi-drv with verbose diagnostics
        run: |
          set -euo pipefail
          make -j1 package/qca-nss/nss-wifi-drv/compile V=sc \
            REVISION="$(git rev-parse --short HEAD)" GWRT_CS02_KERNEL_SIZE=12288k \
            2>&1 | tee logs/nss-wifi-drv-build.log

      - name: Audit kernel and module output
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(build_dir/target-*/linux-qualcommax_ipq60xx/nss-wifi-drv-*/nss-wifi-drv.ko)
          test "${#modules[@]}" -eq 1
          module="${modules[0]}"
          vermagic="$(modinfo -F vermagic "$module")"
          test "${vermagic%% *}" = "$(< logs/kernel.release)"
          {
            file "$module"
            modinfo "$module"
            sha256sum "$module"
          } | tee logs/kernel-module-audit.txt
          cp "$module" logs/nss-wifi-drv.ko

      - name: Upload NSS diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-ss01-nss-diagnostic-${{ env.VERSION }}
          path: |
            .config
            diagnostics-config.txt
            logs/*
            build_dir/target-*/linux-qualcommax_ipq60xx/linux-*/.config
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
