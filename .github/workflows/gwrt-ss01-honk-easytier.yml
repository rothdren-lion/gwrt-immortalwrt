name: GWRT IPQ60xx Honk + EasyTier LuCI-only (four profiles)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYMMDD-NN)'
        required: true
        default: '261115-04'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.device }} Honk firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        device: [ss01, cs02, cs02-gwrt2, cs07]
    concurrency:
      group: gwrt-ipq60xx-honk-${{ matrix.device }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            build-essential busybox clang llvm flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libbpf-dev libclang-dev libncurses-dev \
            libssl-dev pkg-config python3-setuptools python3-pyelftools rsync \
            squashfs-tools unzip util-linux zlib1g-dev file wget swig xz-utils \
            zstd cmake dnsmasq-base dnsutils lua5.1
          LLVM_BIN="$(dirname "$(readlink -f "$(command -v clang)")")"
          for tool in llvm-strip llc opt llvm-dis; do
            [ -x "$LLVM_BIN/$tool" ] && sudo ln -sf "$LLVM_BIN/$tool" "/usr/local/bin/$tool"
          done
          command -v llvm-strip

      - name: Install Playwright browser for modal regression
        if: matrix.device == 'ss01'
        run: |
          set -euo pipefail
          browser_dir="$RUNNER_TEMP/gwrt-browser"
          npm install --prefix "$browser_dir" --no-save playwright@1.62.1
          "$browser_dir/node_modules/.bin/playwright" install --with-deps chromium
          playwright_path="$browser_dir/node_modules/playwright"
          chrome_path="$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$playwright_path")"
          echo "GWRT_PLAYWRIGHT=$playwright_path" >> "$GITHUB_ENV"
          echo "GWRT_CHROME=$chrome_path" >> "$GITHUB_ENV"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: gwrt-dl-${{ hashFiles('rules.mk', 'Config.in', 'include/**') }}
          restore-keys: |
            gwrt-dl-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: staging_dir/toolchain-*
          key: gwrt-tc-2404-${{ hashFiles('toolchain/**', 'tools/**', 'include/kernel*', 'rules.mk', 'Config.in') }}
          restore-keys: |
            gwrt-tc-2404-

      - name: Fetch pinned Honk source and resolve toolchains
        id: honk_source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/honk-source"
          git clone --depth 1 --branch v0.1.0-beta.6 \
            https://github.com/daeuniverse/honk.git "$RUNNER_TEMP/honk-source"
          source="$RUNNER_TEMP/honk-source"
          stable="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' "$source/rust-toolchain.toml")"
          ebpf="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' "$source/crates/honk-ebpf/rust-toolchain.toml")"
          linker_version="$(sed -n 's/^BPF_LINKER_VERSION=//p' "$source/.github/ci/pins.env")"
          linker_sha="$(sed -n 's/^BPF_LINKER_SHA256=//p' "$source/.github/ci/pins.env")"
          test -n "$stable" -a -n "$ebpf" -a -n "$linker_version" -a -n "$linker_sha"
          {
            echo "stable=$stable"
            echo "ebpf=$ebpf"
            echo "linker_version=$linker_version"
            echo "linker_sha=$linker_sha"
            echo "source_commit=$(git -C "$source" rev-parse HEAD)"
            echo "source_tag=$(git -C "$source" describe --tags --always)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Honk source tag: v0.1.0-beta.6"
            echo "Honk source commit: $(git -C "$source" rev-parse HEAD)"
            echo "Honk feed commit: bb039381d2ae9a84dd0c40607c00ccf9fd9fdabf"
            echo "Doona editions: embedded (standard) + embedded-lite (preview)"
            echo "Rust stable: $stable"
            echo "Rust eBPF: $ebpf"
            echo "bpf-linker: $linker_version ($linker_sha)"
          } > honk-source.txt

      - name: Install Rust stable target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.honk_source.outputs.stable }}
          target: aarch64-unknown-linux-musl

      - name: Install Rust nightly for Honk eBPF
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.honk_source.outputs.ebpf }}
          components: rust-src, llvm-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: honk-cargo-${{ steps.honk_source.outputs.source_commit }}-aarch64
          restore-keys: |
            honk-cargo-

      - name: Install pinned bpf-linker
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          archive="$RUNNER_TEMP/bpf-linker.tar.zst"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${{ steps.honk_source.outputs.linker_version }}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${{ steps.honk_source.outputs.linker_sha }}  $archive" | sha256sum -c -
          zstd -dc "$archive" | tar -xf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          bpf-linker --version

      - name: Install pinned feeds and Honk source
        run: |
          set -euo pipefail
          cp configs/ss01-honk-easytier-feeds.conf feeds.conf
          ./scripts/feeds update -a
          test -f feeds/daeuniverse/honk/Makefile
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/honk-source/" feeds/daeuniverse/honk/src/
          for feed in feeds/*; do
            [ -d "$feed/.git" ] || continue
            printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"
          done > feeds-revisions.txt
          sh scripts/gwrt-apply-feed-overlays.sh
          ./scripts/feeds install -a
          sh gwrt-theme-V3/scripts/integrate.sh --no-config
          sed -i 's|^  DEPENDS:=+libpython3$|  DEPENDS:=+libpython3 +libffi|' \
            feeds/packages/lang/python/python3/Makefile

      - name: Generate and validate board configuration
        env:
          DEVICE: ${{ matrix.device }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/gwrt-mk-ipq60xx-honk-config.py "$DEVICE" --version "$VERSION"
          make defconfig
          sh gwrt-check-target.sh .config "$DEVICE"
          python3 scripts/gwrt-validate-ipq60xx-honk.py "$DEVICE" .config
          sh scripts/gwrt-source-preflight.sh
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|^CONFIG_VERSION_NUMBER|^CONFIG_PACKAGE_(honk|luci-app-honk|easytier|luci-app-easytier|vmlinux-btf-builtin)' .config

      - name: Test adblock, modal UI, factory layout and Mesh regressions
        run: |
          set -euo pipefail
          python3 scripts/tests/test-gwrt-tv-adblock-query.py
          python3 scripts/tests/test-gwrt-tv-adblock-runtime.py
          lua5.1 scripts/tests/test-gwrt-tv-adblock-luci.lua package/gwrt-tv-adblock/luci-app-gwrt-tvadblock/luasrc/model/cbi/tvadblock.lua
          python3 scripts/tests/test-ipq60xx-factory-rootfs.py
          python3 scripts/tests/test-gwrt-wifiroam-autopair.py

      - name: Test modal sizing and package actions in Chromium
        if: matrix.device == 'ss01'
        run: node scripts/tests/test-gwrt-modal-package-ui.js

      - name: Test SS-01 calibration and first-boot Mesh
        if: matrix.device == 'ss01'
        run: |
          set -euo pipefail
          GWRT_SS01_TEST_BUSYBOX="$(command -v busybox)"
          export GWRT_SS01_TEST_BUSYBOX
          sh scripts/tests/test-gwrt-caldata-reboot.sh
          sh scripts/tests/test-ss01-mesh-preset.sh
          python3 scripts/tests/test-ss01-firstboot.py

      - name: Build firmware
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p logs
          taskset -c 0-5 make -j6 download \
            REVISION="$(git rev-parse --short HEAD)" \
            GWRT_CS02_KERNEL_SIZE=12288k 2>&1 | tee logs/download.log
          taskset -c 0-5 make -j6 \
            REVISION="$(git rev-parse --short HEAD)" \
            GWRT_CS02_KERNEL_SIZE=12288k \
            CONFIG_VERSION_DIST=GWRT \
            CONFIG_VERSION_NUMBER="$VERSION" 2>&1 | tee logs/build.log \
            || taskset -c 0-5 make -j1 V=s \
            REVISION="$(git rev-parse --short HEAD)" \
            GWRT_CS02_KERNEL_SIZE=12288k \
            CONFIG_VERSION_DIST=GWRT \
            CONFIG_VERSION_NUMBER="$VERSION" 2>&1 | tee -a logs/build.log

      - name: Verify package manifest, hashes and firmware image
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          target=bin/targets/qualcommax/ipq60xx
          python3 scripts/gwrt-validate-ipq60xx-honk.py "$DEVICE" .config --manifests "$target"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          sums = list(Path('bin/targets').rglob('sha256sums'))
          assert sums, 'no image checksum file produced'
          for path in sums:
              subprocess.run(['sha256sum', '-c', path.name], cwd=path.parent, check=True)
          PY
          python3 scripts/gwrt-verify-ipq60xx-image.py "$target" "$DEVICE" --variant honk-easytier | tee logs/image-audit.log
          cp honk-source.txt logs/honk-source.txt
          cp feeds-revisions.txt logs/feeds-revisions.txt
          cp .config logs/config.buildinfo
          printf 'GWRT %s Honk + Doona; EasyTier LuCI only; adblock; IPTV/UDPXY/Vlmcsd\n' "$DEVICE" > logs/build-label.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-${{ matrix.device }}-honk-easytier-${{ inputs.version }}
          path: |
            bin/targets/qualcommax/ipq60xx/*factory*.bin
            bin/targets/qualcommax/ipq60xx/*sysupgrade*.bin
            bin/targets/qualcommax/ipq60xx/*.manifest
            bin/targets/qualcommax/ipq60xx/*.buildinfo
            bin/targets/qualcommax/ipq60xx/sha256sums
            bin/targets/qualcommax/ipq60xx/profiles.json
            honk-source.txt
            feeds-revisions.txt
            logs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
