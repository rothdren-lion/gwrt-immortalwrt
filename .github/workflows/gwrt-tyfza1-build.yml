name: GWRT TYFZA1 build
# 运行名统一为「机型-时间-第几次」，例如 tyfza1-261119-01。
# 传了 version 就用它（YYMMDD-NN），没传时退化成 TYFZA1-run<序号>。
run-name: ${{ format('tyfza1-{0}', inputs.version || format('run{0}', github.run_number)) }}

# TYFZA1（Realtek RTL9617C 光猫）固件构建。
# 与 gwrt-ss01-honk-easytier 相同的 honk 方案：Rust stable + nightly(rust-src)
# + bpf-linker，honk 源码在 CI 里检出到 feeds/daeuniverse/honk/src。
# config-6.18 打开 CONFIG_KERNEL_DEBUG_INFO_BTF，内核自带 BTF，
# 因此用 vmlinux-btf-builtin 占位，不需要 VMLINUX_BTF_SRC blob。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYMMDD-NN), empty = today-01'
        required: false
        default: ''
      release:
        description: 'Publish images to a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gwrt-tyfza1-build
  cancel-in-progress: false

jobs:
  build:
    name: TYFZA1 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 混合模型：分支只放"内核 + 机型专属"的差异，共享层（主题/插件/脚本/
      # 文档/配置生成器）每次从 master 取最新。这样改一次主题或插件，所有
      # 机型下次构建都自动生效；而内核版本和 target 补丁互不干扰。
      - name: Sync shared layer from master
        if: github.ref != 'refs/heads/master'
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          shared_sha="$(git rev-parse FETCH_HEAD)"
          git checkout "$shared_sha" -- \
            package/ gwrt-theme-V3/ docs/ scripts/ configs/ AGENTS.md 'gwrt-*.sh' \
            ':(exclude)package/tyfza1-pon-control' ':(exclude)package/tyfza1-storage' \
            ':(exclude)package/luci-app-tyfza1-pon' ':(exclude)configs/tyfza1-feeds.conf' \
            ':(exclude)gwrt-mk-tyfza1-config.sh'
          mkdir -p logs
          printf 'device=%s\nshared=%s\n' "$(git rev-parse HEAD)" "$shared_sha" | tee logs/source-revisions.txt
          git status --short | sed -n '1,20p'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # KERNEL_DEBUG_INFO_BTF 打开后 DWARF 会让 build_dir 暴涨，
          # 这里按 gwrt-build.yml 的做法尽量腾空间。
          sudo rm -rf /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /opt/az \
            /usr/local/.ghcup /usr/local/aws-sam-cli /opt/pipx /usr/share/miniconda 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo rm -rf ~/.cache/pip ~/.npm /home/runner/.cache 2>/dev/null || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            build-essential busybox clang llvm flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libbpf-dev libclang-dev libncurses-dev \
            libssl-dev pkg-config python3-setuptools python3-pyelftools rsync \
            squashfs-tools unzip util-linux zlib1g-dev file wget swig xz-utils \
            zstd cmake dwarves device-tree-compiler
          LLVM_BIN="$(dirname "$(readlink -f "$(command -v clang)")")"
          for tool in llvm-strip llc opt llvm-dis; do
            [ -x "$LLVM_BIN/$tool" ] && sudo ln -sf "$LLVM_BIN/$tool" "/usr/local/bin/$tool"
          done
          command -v llvm-strip && pahole --version

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: gwrt-dl-${{ hashFiles('rules.mk', 'Config.in', 'include/**') }}
          restore-keys: |
            gwrt-dl-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: staging_dir/toolchain-*
          key: gwrt-tc-tyfza1-2404-${{ hashFiles('toolchain/**', 'tools/**', 'include/kernel*', 'target/linux/rtl9617c/Makefile', 'rules.mk', 'Config.in') }}

      - name: Fetch locked Honk source and resolve toolchains
        id: honk_source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/honk-source"
          git clone --depth 1 --branch v0.1.0-beta.6 \
            https://github.com/daeuniverse/honk.git "$RUNNER_TEMP/honk-source"
          source="$RUNNER_TEMP/honk-source"
          stable="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' "$source/rust-toolchain.toml")"
          ebpf="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' "$source/crates/honk-ebpf/rust-toolchain.toml")"
          linker_version="$(sed -n 's/^BPF_LINKER_VERSION=//p' "$source/.github/ci/pins.env")"
          linker_sha="$(sed -n 's/^BPF_LINKER_SHA256=//p' "$source/.github/ci/pins.env")"
          test -n "$stable" -a -n "$ebpf" -a -n "$linker_version" -a -n "$linker_sha"
          {
            echo "stable=$stable"
            echo "ebpf=$ebpf"
            echo "linker_version=$linker_version"
            echo "linker_sha=$linker_sha"
            echo "source_commit=$(git -C "$source" rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Honk source tag: v0.1.0-beta.6"
            echo "Honk source commit: $(git -C "$source" rev-parse HEAD)"
            echo "Rust stable: $stable"
            echo "Rust eBPF: $ebpf"
            echo "bpf-linker: $linker_version ($linker_sha)"
            echo "Target: TYFZA1 / rtl9617c (Realtek RTL9617C ONU)"
          } > honk-source.txt

      - name: Install Rust stable target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.honk_source.outputs.stable }}
          target: aarch64-unknown-linux-musl

      - name: Install Rust nightly for Honk eBPF
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.honk_source.outputs.ebpf }}
          components: rust-src, llvm-tools

      - name: Resolve PON cross-compiler
        env:
          PON_RUST_TOOLCHAIN: ${{ steps.honk_source.outputs.stable }}
        run: |
          set -euo pipefail
          target=aarch64-unknown-linux-musl
          cargo="$(rustup which --toolchain "$PON_RUST_TOOLCHAIN" cargo)"
          rustc="$(rustup which --toolchain "$PON_RUST_TOOLCHAIN" rustc)"
          test "${cargo%/*}/rustc" = "$rustc"
          test -x "$cargo" -a -x "$rustc"
          rustup target list --installed --toolchain "$PON_RUST_TOOLCHAIN" | grep -Fx "$target"
          "$rustc" --version
          "$cargo" --version
          printf 'TYFZA1_CARGO=%s\n' "$cargo" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: honk-cargo-${{ steps.honk_source.outputs.source_commit }}-aarch64
          restore-keys: |
            honk-cargo-

      - name: Preflight ARM64 OMCI static library
        run: |
          set -euo pipefail
          target=aarch64-unknown-linux-musl
          export CARGO_TARGET_DIR="$RUNNER_TEMP/tyfza1-omci-preflight"
          export RUSTC="${TYFZA1_CARGO%/*}/rustc"
          export RUSTFLAGS='-C target-cpu=cortex-a55'
          "$TYFZA1_CARGO" build --manifest-path package/tyfza1-pon-control/omci/Cargo.toml \
            --release --locked --target "$target"
          archive="$CARGO_TARGET_DIR/$target/release/libtyfza1_omci.a"
          test -s "$archive"
          readelf -h "$archive" > "$RUNNER_TEMP/tyfza1-omci-elf.txt"
          grep -E 'Machine:[[:space:]]*AArch64' "$RUNNER_TEMP/tyfza1-omci-elf.txt" >/dev/null

      - name: Install pinned bpf-linker
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          archive="$RUNNER_TEMP/bpf-linker.tar.zst"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${{ steps.honk_source.outputs.linker_version }}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${{ steps.honk_source.outputs.linker_sha }}  $archive" | sha256sum -c -
          zstd -dc "$archive" | tar -xf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          bpf-linker --version

      - name: Install feeds and Honk source
        run: |
          set -euo pipefail
          cp configs/tyfza1-feeds.conf feeds.conf
          ./scripts/feeds update -a
          test -f feeds/daeuniverse/honk/Makefile
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/honk-source/" feeds/daeuniverse/honk/src/
          for feed in feeds/*; do
            [ -d "$feed/.git" ] || continue
            printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"
          done > feeds-revisions.txt
          sh scripts/gwrt-apply-feed-overlays.sh
          ./scripts/feeds install -a
          sh gwrt-theme-V3/scripts/integrate.sh --no-config
          # python3-base 要先编 libffi 才有 ffi.h
          sed -i 's|^  DEPENDS:=+libpython3$|  DEPENDS:=+libpython3 +libffi|' \
              feeds/packages/lang/python/python3/Makefile
          # mbedtls 3.6 + GCC 14 + musl fortify：aarch64 上 string.h 的
          # __always_inline memset 会报 target specific option mismatch。
          # 只对 mbedtls 关掉 FORTIFY（它自身已有边界检查），不影响其他包。
          sed -i '1i PKG_FORTIFY_SOURCE:=0' package/libs/mbedtls/Makefile
          head -2 package/libs/mbedtls/Makefile

      - name: Generate TYFZA1 config
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VER="$INPUT_VERSION"
          [ -n "$VER" ] || VER="$(date -u +%Y%m%d)-01"
          echo "VER=$VER" >> "$GITHUB_ENV"
          OUT=.config VER="$VER" sh gwrt-mk-tyfza1-config.sh
          make defconfig
          mkdir -p logs
          cp .config logs/openwrt.config
          sh gwrt-check-target.sh .config tyfza1
          test "$(grep -c '^CONFIG_TARGET_DEVICE_rtl9617c_generic_DEVICE_.*=y$' .config)" -eq 1
          grep -Fx 'CONFIG_TARGET_DEVICE_rtl9617c_generic_DEVICE_tianyi_tyfza1=y' .config
          for package in tyfza1-pon-control tyfza1-storage luci-app-tyfza1-pon honk luci-app-honk vmlinux-btf-builtin gwrt-wifiroam-v5 gwrt-mesh-apmode; do
            grep -Fx "CONFIG_PACKAGE_$package=y" .config || {
              echo "Required built-in TYFZA1 package missing: $package" >&2
              exit 1
            }
          done
          grep -Fx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config
          grep -Fx 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' .config
          grep -Fx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|^CONFIG_VERSION_NUMBER|^CONFIG_PACKAGE_(honk|luci-app-honk|vmlinux-btf|luci-app-easytier|bandix-plus|ttyd|gwrt-wifiroam-v5|luci-app-pon-info)' .config || echo "(no matching config lines)"

      - name: Test mesh / pon-info helpers
        run: |
          set -euo pipefail
          sh scripts/tests/test-gwrt-socinfo.sh || echo "socinfo test skipped"
          python3 scripts/tests/test-gwrt-wifiroam.py || echo "wifiroam test skipped"

      - name: Preflight TYFZA1 UBIFS seed
        run: |
          set -euo pipefail
          mkdir -p logs
          make -j6 tools/mtd-utils/compile V=s 2>&1 | tee logs/ubifs-host-build.log
          mkfs="$PWD/staging_dir/host/bin/mkfs.ubifs"
          work="$(mktemp -d "$RUNNER_TEMP/tyfza1-seed.XXXXXX")"
          test "$("$mkfs" -x zstd --version)" = 'mkfs.ubifs (mtd-utils) 2.3.1'
          python3 package/tyfza1-storage/build_overlay_seed.py "$mkfs" "$work/overlay-seed.ubifs.gz" \
            2>&1 | tee logs/ubifs-seed.log
          gzip -t "$work/overlay-seed.ubifs.gz"
          test -s "$work/overlay-seed.ubifs.gz.json"
          cp "$work/overlay-seed.ubifs.gz.json" logs/ubifs-seed.json

      - name: Verify TYFZA1 rootfs limit constants
        run: |
          set -euo pipefail
          limit=42029056
          leb=126976
          [ "$((limit % leb))" -eq 0 ]
          python3 - "$limit" "$leb" <<'PY'
          import sys
          from pathlib import Path

          limit, leb = map(int, sys.argv[1:3])
          assert limit % leb == 0
          sources = [
              'target/linux/rtl9617c/image/Makefile',
              'target/linux/rtl9617c/base-files/lib/upgrade/tyfza1-storage.sh',
              '.github/workflows/gwrt-tyfza1-build.yml',
          ]
          for name in sources:
              text = Path(name).read_text()
              assert str(limit) in text, f'{name} does not declare {limit}'
              legacy = '33648' '640'
              assert legacy not in text, f'{name} still has the OEM {legacy} limit'
          print(f'TYFZA1 rootfs limit aligned: {limit} bytes = {limit // leb} LEBs')
          PY
          echo "ROOTFS_LIMIT=$limit" >> "$GITHUB_ENV"

      - name: Preflight TYFZA1 boot FIT
        env:
          FIT_KERNEL_VERSION: '6.18.62'
        run: |
          set -euo pipefail
          mkdir -p logs
          make -j6 tools/mkimage/compile V=s 2>&1 | tee logs/fit-host-build.log
          mkimage="$PWD/staging_dir/host/bin/mkimage"
          work="$(mktemp -d "$RUNNER_TEMP/tyfza1-fit.XXXXXX")"
          python3 - "$work" <<'PY'
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          header = bytearray(64)
          header[56:60] = b'ARM\x64'
          (work / 'Image').write_bytes(header + b'TYFZA1 FIT preflight fixture\n')
          header[:4] = b'\x7fELF'
          (work / 'vmlinux').write_bytes(header)
          PY
          for variant in base 2p5g; do
            printf '/dts-v1/; / { model = "TYFZA1 fixture %s"; compatible = "realtek,taurus"; };\n' "$variant" |
              dtc -I dts -O dtb -o "$work/$variant.dtb"
          done
          if python3 target/linux/rtl9617c/python/make_ubi_fit.py \
            "$work/vmlinux" "$work/base.dtb" "$work/rejected" --dtb-2p5g "$work/2p5g.dtb" \
            --kver "$FIT_KERNEL_VERSION" --mkimage "$mkimage" > logs/fit-reject-elf.log 2>&1; then
            printf '%s\n' 'ELF input unexpectedly accepted' >&2
            exit 1
          fi
          grep -F 'is not a raw ARM64 Linux Image' logs/fit-reject-elf.log
          test ! -e "$work/rejected/image.itb"
          python3 target/linux/rtl9617c/python/make_ubi_fit.py \
            "$work/Image" "$work/base.dtb" "$work/fit" --dtb-2p5g "$work/2p5g.dtb" \
            --kver "$FIT_KERNEL_VERSION" --mkimage "$mkimage" 2>&1 | tee logs/fit-packaging.log
          fit="$work/fit/image.itb"
          "$mkimage" -l "$fit" | tee logs/fit-contents.txt
          test "$(stat -c %s "$fit")" -le "$((0x600000))"
          test "$(fdtget -t s "$fit" /images/kernel description)" = "Native OpenWrt Linux $FIT_KERNEL_VERSION"
          test "$(fdtget -t s "$fit" /configurations default)" = conf-0
          test "$(fdtget -t s "$fit" /configurations/conf-0 fdt)" = fdt-2p5g
          test "$(fdtget -t s "$fit" /configurations/conf-1 fdt)" = fdt-dts
          for conf in conf-0 conf-1; do
            test "$(fdtget -t s "$fit" "/configurations/$conf" script)" = script
          done
          python3 - "$work" <<'PY'
          import lzma
          import re
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          fit = work / 'fit/image.itb'

          def data(node):
              raw = subprocess.check_output(['fdtget', '-t', 'bx', fit, f'/images/{node}', 'data'])
              return bytes(int(byte, 16) for byte in raw.split())

          script = data('script')
          assert script == (work / 'fit/boot.cmd').read_bytes(), 'FIT boot script changed'
          variables = set(re.findall(rb'\$\{([a-z_][a-z0-9_]*)\}', script))
          assert variables == {b'root_mtd', b'tyfza1_root', b'tyfza1_block', b'tyfza1_slot',
                               b'b_conf', b'conf_match', b'unzip_src'}, variables
          assert b'@BASE_ARGS@' not in script and b'console=ttyS0,115200n8' in script
          assert b'ubi_r0' in script and b'ubi_r1' in script
          for node, name in [('kernel', 'Image'), ('fdt-2p5g', '2p5g.dtb'), ('fdt-dts', 'base.dtb')]:
              assert lzma.decompress(data(node)) == (work / name).read_bytes(), f'FIT {node} mismatch'
          print('TYFZA1 FIT fixture: script, kernel, dual DTB payloads and configuration mappings verified')
          PY

      - name: Build firmware
        id: build_firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          revision="$(git rev-parse --short HEAD)"
          taskset -c 0-5 make -j6 download REVISION="$revision" 2>&1 | tee logs/download.log
          args=(REVISION="$revision" CONFIG_VERSION_DIST=GWRT CONFIG_VERSION_NUMBER="$VER")
          # Do not relink on this tree after image generation: the embedded
          # recovery build can leave CONFIG_INITRAMFS_SOURCE set in .config.
          taskset -c 0-5 make -j6 V=s "${args[@]}" 2>&1 | tee logs/build.log

      - name: Verify kernel BTF and image contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          kernels=(build_dir/target-*/linux-rtl9617c_generic/linux-6.18.62/vmlinux)
          test "${#kernels[@]}" -eq 1
          cp "${kernels[0]%/*}/.config" logs/kernel.config
          grep -Fx 'CONFIG_DEBUG_INFO_BTF=y' logs/kernel.config
          readelf -SW "${kernels[0]}" > logs/kernel-sections.txt
          grep -E '[[:space:]]\.BTF[[:space:]]' logs/kernel-sections.txt
          manifests=(bin/targets/rtl9617c/generic/*.manifest)
          test "${#manifests[@]}" -eq 1
          images=(bin/targets/rtl9617c/generic/*tianyi_tyfza1*sysupgrade.bin)
          roots=(bin/targets/rtl9617c/generic/*tianyi_tyfza1*rootfs.squashfs)
          fits=(bin/targets/rtl9617c/generic/*tianyi_tyfza1*kernel.itb)
          test "${#images[@]}" -eq 1
          test "${#roots[@]}" -eq 1
          test "${#fits[@]}" -eq 1
          test -s "${images[0]}"
          test -s "${roots[0]}"
          test -s "${fits[0]}"
          test "$(stat -c %s "${roots[0]}")" -le "$ROOTFS_LIMIT"
          test "$(stat -c %s "${fits[0]}")" -le "$((0x600000))"
          staging_dir/host/bin/mkimage -l "${fits[0]}" > logs/fit-final-contents.txt
          kdir="${kernels[0]%/*/*}"
          device_roots=("$kdir"/root.squashfs+pkg=*)
          test "${#device_roots[@]}" -eq 1
          cmp "${device_roots[0]}" "${roots[0]}"
          python3 - "${images[0]}" "${fits[0]}" "$kdir/Image" "${roots[0]}" "$ROOTFS_LIMIT" <<'PY'
          import lzma
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          upgrade, fit, raw_image, rootfs = map(Path, sys.argv[1:5])
          limit = int(sys.argv[5])
          with tarfile.open(upgrade) as archive:
              [member] = [entry for entry in archive if entry.isfile() and entry.name.endswith('/kernel')]
              assert archive.extractfile(member).read() == fit.read_bytes(), 'sysupgrade FIT differs'
              root = archive.getmember(member.name.removesuffix('/kernel') + '/root')
              assert 0 < root.size <= limit, f'sysupgrade root size exceeds GWRT limit {limit} or is empty: {root.size}'
              expected = rootfs.read_bytes()
              with archive.extractfile(root) as data:
                  assert data.read(len(expected)) == expected, 'sysupgrade rootfs differs'
                  assert data.read() == bytes(-len(expected) % 1024), 'invalid sysupgrade rootfs padding'
          data = subprocess.check_output(['fdtget', '-t', 'bx', fit, '/images/kernel', 'data'])
          kernel = lzma.decompress(bytes(int(token, 16) for token in data.split()))
          assert kernel == raw_image.read_bytes(), 'FIT kernel differs from built ARM64 Image'
          print(f'PASS: sysupgrade FIT embeds the built Image ({len(kernel)} bytes); '
                f'device rootfs matches ({len(expected)} bytes standalone, {root.size} bytes in tar)')
          PY
          for package in tyfza1-pon-control tyfza1-storage luci-app-tyfza1-pon honk gwrt-wifiroam-v5 gwrt-mesh-apmode; do
            awk -v pkg="$package" '$1 == pkg { found = 1 } END { exit !found }' "${manifests[0]}" || {
              echo "Missing from TYFZA1 manifest: $package" >&2
              exit 1
            }
          done
          ls -lh bin/targets/rtl9617c/generic/
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          sums = list(Path('bin/targets/rtl9617c').rglob('sha256sums'))
          assert sums, 'no image checksum file produced'
          for path in sums:
              subprocess.run(['sha256sum', '-c', path.name], cwd=path.parent, check=True)
          PY
          cp honk-source.txt logs/honk-source.txt

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-tyfza1-${{ env.VER }}
          path: |
            bin/targets/rtl9617c/generic/*sysupgrade*
            bin/targets/rtl9617c/generic/*rootfs*
            bin/targets/rtl9617c/generic/*.itb
            bin/targets/rtl9617c/generic/sha256sums
            bin/targets/rtl9617c/generic/profiles.json
            bin/targets/rtl9617c/generic/*.buildinfo
            bin/targets/rtl9617c/generic/*.manifest
            honk-source.txt
            feeds-revisions.txt
            logs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Collect TYFZA1 failure evidence
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p logs
          if [ -f .config ]; then cp .config logs/openwrt.config; fi
          if [ ! -f logs/source-revisions.txt ]; then
            printf 'device=%s\nshared=not-synced\n' "$(git rev-parse HEAD 2>/dev/null || printf unavailable)" > logs/source-revisions.txt
          fi
          df -h . > logs/failure-disk.txt || true
          shopt -s nullglob
          for kernel_config in build_dir/target-*/linux-rtl9617c_generic/linux-6.18.62/.config{,.set}; do
            cp "$kernel_config" "logs/kernel${kernel_config##*/}"
          done
          python3 - <<'PY' | tee logs/tyfza1-image-sizes.tsv
          from pathlib import Path
          import hashlib
          import os

          work = Path('build_dir')
          out = Path('bin/targets/rtl9617c/generic')
          kdir = 'target-*/linux-rtl9617c_generic/'
          entries = {
              'ordinary_Image': work.glob(kdir + 'Image'),
              'initramfs_Image': work.glob(kdir + 'Image-initramfs.*'),
              'common_rootfs': work.glob(kdir + 'root.squashfs'),
              'device_rootfs': work.glob(kdir + 'root.squashfs+pkg=*'),
              'staged_kernel_lzma': work.glob(kdir + 'tianyi_tyfza1-kernel.itb.fit/kernel.lzma'),
              'staged_FIT': work.glob(kdir + 'tianyi_tyfza1-kernel.itb.fit/image.itb'),
              'published_FIT': out.glob('*tianyi_tyfza1*kernel.itb'),
              'published_rootfs': out.glob('*tianyi_tyfza1*rootfs.squashfs'),
              'sysupgrade': out.glob('*tianyi_tyfza1*sysupgrade.bin'),
          }
          root_limit = int(os.environ['ROOTFS_LIMIT'])
          limits = {'device_rootfs': root_limit, 'published_rootfs': root_limit,
                    'staged_FIT': 0x600000, 'published_FIT': 0x600000}
          print('kind\tstatus\tbytes\tlimit_bytes\tpath\tdetail')
          for kind, matches in entries.items():
              paths = sorted(path for path in matches if path.is_file())
              limit = limits.get(kind)
              if not paths:
                  print(f'{kind}\tmissing\t-\t{limit or "-"}\t-\t-')
              for path in paths:
                  size = path.stat().st_size
                  status = 'empty' if not size else 'over-limit' if limit and size > limit else 'present'
                  detail = '-'
                  if kind == 'ordinary_Image':
                      with path.open('rb') as image:
                          header = image.read(64)
                          image.seek(0)
                          digest = hashlib.file_digest(image, 'sha256').hexdigest()
                      raw = len(header) == 64 and not header.startswith(b'\x7fELF') and header[56:60] == b'ARM\x64'
                      detail = f'arm64_image={raw} sha256={digest}'
                  print(f'{kind}\t{status}\t{size}\t{limit or "-"}\t{path}\t{detail}')
          PY

      - name: Measure smaller SquashFS candidates without changing packages
        if: failure() && steps.build_firmware.outcome != 'skipped'
        run: |
          set -euo pipefail
          shopt -s nullglob
          roots=(build_dir/target-*/linux-rtl9617c_generic/root.squashfs+pkg=*)
          [ "${#roots[@]}" -eq 1 ] || exit 0
          baseline="${roots[0]}"
          limit=$ROOTFS_LIMIT
          [ "$(stat -c %s "$baseline")" -gt "$limit" ] || exit 0
          tree="${baseline%/*}/target-dir-${baseline##*+pkg=}"
          tool="$PWD/staging_dir/host/bin/mksquashfs4"
          [ -d "$tree" ] && [ -x "$tool" ] || exit 0
          work="$(mktemp -d "$RUNNER_TEMP/tyfza1-rootfs.XXXXXX")"
          report=logs/tyfza1-squashfs-candidates.tsv
          printf 'block_kib\tbcj\tbytes\tresult\n' > "$report"
          printf '256\tno\t%s\tover-limit\n' "$(stat -c %s "$baseline")" >> "$report"
          for spec in 512:no 1024:no 512:arm64 1024:arm64; do
            IFS=: read -r block bcj <<< "$spec"
            filters=()
            if [ "$bcj" = arm64 ]; then filters=(-Xbcj arm64); fi
            image="$work/$block-$bcj.squashfs"
            if "$tool" "$tree" "$image" -nopad -noappend -root-owned \
                -comp xz -Xpreset 9 -Xe -Xlc 0 -Xlp 2 -Xpb 2 "${filters[@]}" \
                -b "${block}k" -p '/dev d 755 0 0' -p '/dev/console c 600 0 0 5 1' \
                -no-xattrs -block-readers 4 -small-readers 4 > "logs/squashfs-$block-$bcj.log" 2>&1; then
              size="$(stat -c %s "$image")"
              result=over-limit
              if [ "$size" -le "$limit" ]; then result=fits; fi
              printf '%s\t%s\t%s\t%s\n' "$block" "$bcj" "$size" "$result" >> "$report"
            else
              printf '%s\t%s\t-\tcompression-failed\n' "$block" "$bcj" >> "$report"
            fi
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gwrt-tyfza1-${{ env.VER || format('run{0}', github.run_number) }}-logs
          path: |
            logs/
            honk-source.txt
            feeds-revisions.txt
            build_dir/target-*/linux-rtl9617c_generic/Image
            build_dir/target-*/linux-rtl9617c_generic/root.squashfs+pkg=*
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish release
        if: success() && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp bin/targets/rtl9617c/generic/*sysupgrade* release/ 2>/dev/null || true
          cp bin/targets/rtl9617c/generic/*rootfs* release/ 2>/dev/null || true
          cp bin/targets/rtl9617c/generic/*.itb release/ 2>/dev/null || true
          cp bin/targets/rtl9617c/generic/sha256sums release/ 2>/dev/null || true
          cp honk-source.txt release/
          sha256sum release/* > release/tyfza1-${{ env.VER }}.sha256sums
          gh release create "gwrt-tyfza1-${{ env.VER }}" release/* \
            --title "GWRT TYFZA1 ${{ env.VER }}" \
            --notes "TYFZA1 (RTL9617C) build: Honk v0.1.0-beta.6 (Doona Lite), mesh backhaul, bandix, ttyd, PON info recorder."
