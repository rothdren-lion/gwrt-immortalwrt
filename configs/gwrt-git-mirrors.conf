# Ordered GitHub mirrors used by scripts/gwrt-feeds-update.sh and
# scripts/gwrt-git-clone.sh. First entry a runner can reach wins, so dead
# entries only cost a probe when everything above them fails.
#
# 2026-11-25 runner measurements (ls-remote / shallow clone of
# immortalwrt/packages, pinned sha fetchable):
#   ghfast.top       397ms / 1.9s / 31MB/s / yes
#   gh-proxy.com     331ms / 2.0s / 30MB/s / yes
#   kkgithub.com     unreachable
#   hub.gitmirror    unreachable
#
# {path} = owner/repo(.git). One URL per line, '#' starts a comment.
https://ghfast.top/https://github.com/{path}
https://gh-proxy.com/https://github.com/{path}
https://ghproxy.net/https://github.com/{path}
https://gitclone.com/github.com/{path}
https://github.com/{path}
