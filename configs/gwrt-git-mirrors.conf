# GitHub mirrors for feed + source fetches, used by scripts/gwrt-feeds-update.sh
# and scripts/gwrt-git-clone.sh. First reachable entry wins; the last entry is
# the upstream fallback so a dead mirror never blocks a build.
#
# Measured 2026-11-25 on ubuntu-24.04 runner (immortalwrt/packages, pinned
# commit fetchable): gh-proxy 334ms/1.3s/44MB/s, ghfast 583ms/2.7s/22MB/s,
# github 329ms/1.2s/50MB/s. kkgithub, hub.gitmirror, ghproxy.net, gitclone are
# unreachable from the runner and were dropped.
#
# {path} = owner/repo(.git). One URL per line, '#' starts a comment.
https://gh-proxy.com/https://github.com/{path}
https://ghfast.top/https://github.com/{path}
https://github.com/{path}
